<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="UNO Classic — free browser card game">
  <defs>
    <radialGradient id="felt" cx="42%" cy="42%" r="80%">
      <stop offset="0" stop-color="#14805a" />
      <stop offset="0.52" stop-color="#0c5b40" />
      <stop offset="1" stop-color="#041f17" />
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2685e" />
      <stop offset="1" stop-color="#d33a30" />
