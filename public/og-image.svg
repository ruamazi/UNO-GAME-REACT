  </g>
  <text x="70" y="574" font-family="Arial, sans-serif" font-weight="600" font-size="21" fill="#ffffff" fill-opacity="0.5">No sign-up · auto-save · mobile friendly</text>

  <g filter="url(#cardShadow)">
    <g transform="rotate(10 875 310)">
      <rect x="760" y="150" width="230" height="320" rx="26" fill="#fdf8ec" />
