    <tspan fill="#e6483d">U</tspan><tspan fill="#f5c33b">N</tspan><tspan fill="#2f7fd1">O</tspan>
  </text>
  <text x="70" y="372" font-family="Arial, sans-serif" font-weight="700" font-size="34" fill="#ffffff">Classic card game with smart AI.</text>
  <text x="70" y="414" font-family="Arial, sans-serif" font-weight="400" font-size="25" fill="#ffffff" fill-opacity="0.68">House rules, UNO catches and Wild +4 challenges.</text>
